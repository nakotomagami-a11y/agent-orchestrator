name: Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/web/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies (Tauri + AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (standalone)
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          unset __NEXT_PRIVATE_STANDALONE_CONFIG
          pnpm exec next build

      - name: Prepare Tauri bundle
        working-directory: apps/web
        run: node scripts/prepare-bundle.mjs

      - name: Build Tauri app (Linux)
        working-directory: apps/web
        env:
          # Sign the updater artifacts so the in-app updater will accept them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # AppImage only on Linux — the .deb can't self-update (dpkg owns its
          # files). The .tar.gz + .sig are the updater artifacts consumed by
          # latest.json. See docs/AUTO_UPDATE.md.
          files: |
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifact (manual run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: linux-installer
          path: |
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
          if-no-files-found: error
