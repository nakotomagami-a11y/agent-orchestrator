<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AGENT.OFFICE / TUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:    #0b0a08;
  --bg-1:  #15120c;
  --bg-2:  #1d1812;
  --line:  #3a2f1d;
  --line-2:#5a4828;

  --p:     #ffb13c;          /* amber phosphor */
  --p-dim: #a06a1c;
  --p-faint:#3a2810;
  --p-soft: #eaa84b;

  --ok:    #88e07e;
  --warn:  #ffb13c;
  --err:   #ff5a5a;
  --info:  #6ad0ff;
  --idle:  #6a5a3a;

  --fs: 13px;
  --lh: 1.42;
}

* { box-sizing: border-box; }
html, body, #app { margin:0; padding:0; height:100%; }
body {
  background: var(--bg);
  color: var(--p);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: var(--fs);
  line-height: var(--lh);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* CRT effect layers */
body::before, body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9000;
}
body::before {
  /* scanlines */
  background:
    repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px);
  mix-blend-mode: multiply;
  opacity: var(--scanline-op, 0.65);
}
body::after {
  /* vignette + phosphor glow */
  background:
    radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%),
    radial-gradient(ellipse at center, color-mix(in oklch, var(--p) 6%, transparent) 0%, transparent 60%);
  opacity: var(--crt-op, 1);
}
[data-crt="off"] body::before { opacity: 0; }
[data-crt="off"] body::after  { opacity: 0; }

::selection { background: var(--p); color: var(--bg); }

button, input, textarea, select {
  font: inherit; color: inherit; background: transparent;
  border: 1px solid var(--line); outline: none;
}
button { cursor: pointer; }

a { color: var(--p); text-decoration: none; }

/* ───────── layout ───────── */
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; min-height: 0; }

/* Title banner */
.banner {
  border-bottom: 1px solid var(--line);
  padding: 6px 14px 2px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
}
.banner pre { margin: 0; color: var(--p); white-space: pre; line-height: 1.05; font-weight: 700; font-size: 10.5px; }
.banner .meta {
  text-align: right;
  font-size: 11px;
  color: var(--p-dim);
}
.banner .meta b { color: var(--p); font-weight: 500; }

/* Menu bar */
.menubar {
  display: flex; gap: 0; padding: 0 8px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  height: 26px;
  align-items: center;
}
.menubar .mi {
  padding: 4px 10px; border: 0; color: var(--p-soft);
}
.menubar .mi b { color: var(--p); text-decoration: underline; text-decoration-color: var(--p); text-underline-offset: 2px; }
.menubar .mi:hover, .menubar .mi.on { background: var(--p); color: var(--bg); }
.menubar .mi:hover b, .menubar .mi.on b { color: var(--bg); }
.menubar .spacer { flex: 1; }
.menubar .right { color: var(--p-dim); padding-right: 6px; }
.menubar .right .ok { color: var(--ok); }

/* Body grid */
.body {
  display: grid;
  grid-template-columns: 360px minmax(0, 1fr);
  min-height: 0;
}

/* Common pane chrome */
.pane {
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
  position: relative;
}
.pane:last-child { border-right: 0; }
.pane-head {
  border-bottom: 1px solid var(--line);
  padding: 4px 10px;
  font-size: 11px;
  color: var(--p-dim);
  display: flex; align-items: center; gap: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  height: 24px;
}
.pane-head b { color: var(--p); font-weight: 700; }
.pane-head .right { margin-left: auto; }

/* Roster */
.roster {
  overflow-y: auto;
  font-size: 12.5px;
}
.roster .filterbar {
  display: flex; gap: 8px; padding: 6px 10px;
  border-bottom: 1px dashed var(--line);
  color: var(--p-dim);
  font-size: 11.5px;
  flex-wrap: wrap;
  align-items: center;
}
.roster .filterbar .input {
  flex: 1; min-width: 120px;
  background: transparent; border: 1px solid var(--line);
  padding: 2px 6px; color: var(--p);
}
.roster .filterbar .input:focus { border-color: var(--p); }
.roster .pill {
  border: 1px solid var(--line); padding: 1px 6px; color: var(--p-dim);
  background: transparent;
}
.roster .pill.on { background: var(--p); color: var(--bg); border-color: var(--p); }
.roster .pill:hover { color: var(--p); }
.roster .pill.on:hover { color: var(--bg); }

.roster table { width: 100%; border-collapse: collapse; }
.roster thead th {
  text-align: left;
  font-weight: 500; font-size: 10.5px; letter-spacing: 0.04em;
  padding: 4px 8px;
  color: var(--p-dim);
  border-bottom: 1px solid var(--line);
  text-transform: uppercase;
  position: sticky; top: 0; background: var(--bg);
  z-index: 1;
}
.roster tbody tr { cursor: pointer; }
.roster tbody td {
  padding: 4px 8px;
  border-bottom: 1px dotted var(--line);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
}
.roster tbody tr:hover td { background: var(--bg-1); color: var(--p); }
.roster tbody tr.sel td {
  background: var(--p);
  color: var(--bg);
}
.roster tbody tr.sel td .dim,
.roster tbody tr.sel td .skill { color: var(--bg); opacity: 0.85; }
.roster tbody tr.sel td:first-child::before { content: "▶ "; }
.roster tbody td.idx { color: var(--p-dim); width: 26px; }
.roster tbody td .skill { color: var(--p-dim); margin-right: 6px; }
.roster tbody td .skill::before { content: "·"; margin-right: 3px; }
.roster tbody td.status { width: 78px; }
.roster tbody td.status .dot { display: inline-block; width: 8px; height: 8px; vertical-align: middle; margin-right: 4px; }
.roster tbody td.status .dot.idle    { background: var(--idle); }
.roster tbody td.status .dot.working { background: var(--p);    box-shadow: 0 0 6px var(--p); animation: blink 1s steps(2) infinite; }
.roster tbody td.status .dot.done    { background: var(--ok);   }
.roster tbody td.status .dot.error   { background: var(--err);  }
.roster tbody td.status .dot.queued  { background: var(--info); }

@keyframes blink { 50% { opacity: 0.4; } }
@keyframes caret { 50% { opacity: 0; } }

/* Main */
.main { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }

.tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px; height: 26px;
  padding: 0 4px;
}
.tabs button {
  background: transparent; border: 0;
  padding: 4px 14px; color: var(--p-dim);
  position: relative;
  border-right: 1px solid var(--line);
}
.tabs button:first-child { border-left: 1px solid var(--line); }
.tabs button.on { background: var(--p); color: var(--bg); font-weight: 700; }
.tabs button:not(.on):hover { color: var(--p); background: var(--bg-1); }
.tabs .key { color: var(--p-faint); margin-right: 4px; }
.tabs button.on .key { color: var(--bg); opacity: 0.6; }
.tabs .spacer { flex: 1; border-bottom: 1px solid var(--line); }
.tabs .breadcrumb {
  margin-left: auto;
  display: inline-flex; align-items: center;
  padding: 4px 10px;
  color: var(--p-dim);
  font-size: 11px;
}
.tabs .breadcrumb b { color: var(--p); font-weight: 500; }

/* Agent header strip */
.headstrip {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1);
}
.headstrip .av {
  width: 48px; height: 48px; border: 1px solid var(--line);
  background: var(--bg-2);
}
.headstrip h1 {
  margin: 0; font-weight: 700; font-size: 18px;
  display: flex; align-items: center; gap: 12px;
  letter-spacing: 0.02em;
}
.headstrip .desc { color: var(--p-dim); font-size: 12px; margin-top: 2px; max-width: 80ch; }
.headstrip .badge {
  font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 1px 6px; border: 1px solid var(--p); background: var(--p-faint); color: var(--p);
}
.headstrip .badge.working { color: var(--p); border-color: var(--p); animation: blink 1.4s steps(2) infinite; }
.headstrip .badge.done    { color: var(--ok); border-color: var(--ok); background: rgba(136,224,126,0.10); }
.headstrip .badge.idle    { color: var(--p-dim); border-color: var(--line-2); background: transparent; }
.headstrip .badge.error   { color: var(--err); border-color: var(--err); background: rgba(255,90,90,0.10); }
.headstrip .badge.queued  { color: var(--info); border-color: var(--info); background: rgba(106,208,255,0.10); }

.headstrip .meta {
  font-size: 11px; color: var(--p-dim); display: flex; gap: 14px; align-items: center;
}
.headstrip .meta b { color: var(--p); font-weight: 500; }

/* Tab body */
.tab-body { overflow-y: auto; padding: 0; }

/* Boxed sections (ASCII border) */
.box {
  margin: 12px 14px;
  border: 1px solid var(--line);
  position: relative;
}
.box > .box-h {
  position: absolute;
  top: -10px; left: 12px;
  padding: 0 6px;
  background: var(--bg);
  font-size: 11px;
  color: var(--p-dim);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.box > .box-h b { color: var(--p); font-weight: 500; }
.box > .box-body { padding: 14px; }

/* Summon form */
.fields {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.f { display: flex; flex-direction: column; gap: 4px; }
.f label { font-size: 10.5px; color: var(--p-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.f .input {
  background: var(--bg-1);
  border: 1px solid var(--line);
  padding: 4px 8px;
  color: var(--p); font-size: 13px;
  height: 26px;
}
.f .input:focus { border-color: var(--p); box-shadow: inset 0 0 0 1px var(--p); }
.f .seg {
  display: inline-flex; border: 1px solid var(--line);
}
.f .seg button {
  border: 0; padding: 3px 9px; color: var(--p-dim); font-size: 12px;
  border-right: 1px solid var(--line);
}
.f .seg button:last-child { border-right: 0; }
.f .seg button.on { background: var(--p); color: var(--bg); font-weight: 700; }
.f .seg button:not(.on):hover { color: var(--p); background: var(--bg-1); }

.prompt-templates {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
}
.tag {
  padding: 1px 7px; font-size: 11px; color: var(--p-dim);
  border: 1px solid var(--line);
}
.tag:hover { color: var(--p); border-color: var(--p); }
.tag.skill { color: var(--p); border-color: var(--p); background: var(--p-faint); }

.prompt {
  width: 100%;
  min-height: 110px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  padding: 8px 10px;
  color: var(--p);
  font-size: 12.5px;
  line-height: 1.55;
  resize: vertical;
  margin-top: 12px;
}
.prompt:focus { border-color: var(--p); }

.actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.btn {
  border: 1px solid var(--p);
  background: var(--p-faint);
  color: var(--p);
  padding: 4px 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 12px;
}
.btn:hover { background: var(--p); color: var(--bg); }
.btn.danger { border-color: var(--err); color: var(--err); background: rgba(255,90,90,0.08); }
.btn.danger:hover { background: var(--err); color: var(--bg); }
.btn.ghost { border-color: var(--line); background: transparent; color: var(--p-dim); }
.btn.ghost:hover { color: var(--p); border-color: var(--p); background: transparent; }

.kbd {
  display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px;
  padding: 0 4px; font-size: 10.5px; color: var(--p-soft); background: var(--bg-1);
  margin-left: 2px;
}

/* Output */
.output {
  margin: 12px 14px;
  border: 1px solid var(--line);
  display: flex; flex-direction: column;
  min-height: 320px;
  position: relative;
}
.output .o-h {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 11px; color: var(--p-dim); text-transform: uppercase; letter-spacing: 0.04em;
}
.output .o-h b { color: var(--p); font-weight: 500; }
.output .o-h .right { margin-left: auto; display: flex; gap: 12px; }
.output .o-body {
  padding: 10px 14px;
  flex: 1;
  overflow-y: auto;
  font-size: 12.5px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.output .o-foot {
  border-top: 1px solid var(--line);
  padding: 3px 10px;
  display: flex; gap: 14px;
  font-size: 11px; color: var(--p-dim);
}
.output .o-foot b { color: var(--p); font-weight: 500; }

.line .who { color: var(--p-dim); font-size: 11px; margin-right: 4px; }
.line .who b { color: var(--p); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.line.user .who b { color: var(--info); }
.line .ts { color: var(--p-faint); margin-left: 8px; }
.line .body { display: block; padding-left: 0; margin: 4px 0 10px; }
.tool-call {
  background: var(--bg-1); border: 1px dashed var(--line);
  padding: 4px 8px; margin: 6px 0;
  font-size: 12px;
}
.tool-call b { color: var(--p); font-weight: 700; }
.tool-call .args { color: var(--p-soft); }
.tool-call .note { color: var(--p-dim); float: right; }
.tool-call .ok { color: var(--ok); }

.caret { display: inline-block; width: 8px; height: 14px; background: var(--p); vertical-align: text-bottom; box-shadow: 0 0 6px var(--p); animation: caret 1s steps(2) infinite; }

/* History list */
.hlist {
  margin: 12px 14px;
  border: 1px solid var(--line);
}
.hrun {
  display: grid;
  grid-template-columns: 100px 1fr 90px 80px 100px 50px;
  gap: 14px;
  padding: 6px 10px;
  border-bottom: 1px dotted var(--line);
  align-items: center;
  font-size: 12px;
  cursor: pointer;
}
.hrun:last-child { border-bottom: 0; }
.hrun:hover { background: var(--bg-1); }
.hrun .when { color: var(--p-dim); font-size: 11px; }
.hrun .prompt { color: var(--p); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrun .num { color: var(--p-dim); text-align: right; font-variant-numeric: tabular-nums; }
.hrun .stat .dot { display: inline-block; width: 7px; height: 7px; vertical-align: middle; margin-right: 4px; }
.hrun .stat .dot.done { background: var(--ok); } .hrun .stat .dot.error { background: var(--err); } .hrun .stat .dot.running { background: var(--p); }

/* Config grid */
.kv {
  display: grid;
  grid-template-columns: 220px 1fr;
  font-size: 12.5px;
}
.kv > div {
  padding: 4px 0; border-bottom: 1px dotted var(--line);
}
.kv > div:nth-child(odd) { color: var(--p-dim); }
.kv > div:last-child, .kv > div:nth-last-child(2) { border-bottom: 0; }

/* Skills/tools display */
.checklist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 14px; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 1px 0; }
.chk .b { width: 12px; text-align: center; color: var(--ok); }
.chk.off .b { color: var(--err); }
.chk.off { color: var(--p-dim); }

/* Activity drawer (overlay) */
.activity {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 360px;
  background: var(--bg);
  border-left: 1px solid var(--line);
  display: grid; grid-template-rows: auto 1fr; min-height: 0;
  z-index: 5;
  box-shadow: -8px 0 32px rgba(0,0,0,0.5);
}
.activity .hd {
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 11px; color: var(--p-dim); text-transform: uppercase; letter-spacing: 0.04em;
  display: flex; align-items: center; gap: 8px;
}
.activity .hd b { color: var(--p); font-weight: 700; }
.activity .hd .x { margin-left: auto; }
.activity .body { overflow-y: auto; }
.activity .a-sect {
  padding: 4px 10px; font-size: 10.5px;
  color: var(--p-faint); text-transform: uppercase; letter-spacing: 0.08em;
  border-bottom: 1px dotted var(--line);
}
.activity .a-row {
  padding: 6px 10px;
  border-bottom: 1px dotted var(--line);
  font-size: 12px;
  cursor: pointer;
}
.activity .a-row:hover { background: var(--bg-1); }
.activity .a-row .top { display: flex; align-items: center; gap: 8px; }
.activity .a-row .top .name { font-weight: 700; }
.activity .a-row .top .when { margin-left: auto; color: var(--p-faint); font-size: 11px; }
.activity .a-row .what { color: var(--p-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

/* Statusbar */
.statusbar {
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11.5px;
  height: 22px;
  padding: 0 10px;
  color: var(--p-dim);
  background: var(--bg-1);
}
.statusbar .seg { color: var(--p-soft); }
.statusbar .seg b { color: var(--p); font-weight: 500; }
.statusbar .sep { color: var(--line-2); }
.statusbar .pip-strip { display: flex; gap: 6px; flex: 1; overflow: hidden; }
.statusbar .pip {
  background: var(--p);
  color: var(--bg);
  padding: 0 6px;
  font-weight: 700;
  font-size: 11px;
  display: inline-flex; gap: 6px; align-items: center;
}
.statusbar .pip:hover { filter: brightness(0.92); }
.statusbar .pip .x { font-weight: 400; opacity: 0.7; padding-left: 2px; }
.statusbar .keys { color: var(--p-dim); margin-left: auto; }
.statusbar .keys .kbd { background: var(--bg); border-color: var(--line-2); }

/* Tweaks panel — replicate API of TweaksPanel but inline */
.twk {
  position: fixed; right: 14px; bottom: 32px; z-index: 200;
  width: 280px;
  background: var(--bg);
  border: 1px solid var(--p);
  font-size: 12px;
  box-shadow: 0 0 24px rgba(255,177,60,0.25), inset 0 0 0 1px var(--bg);
}
.twk .twk-h {
  padding: 4px 10px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 6px;
  text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em;
  color: var(--p-dim);
}
.twk .twk-h b { color: var(--p); }
.twk .twk-h .x { margin-left: auto; padding: 0 4px; }
.twk .twk-body { padding: 10px; display: grid; gap: 10px; max-height: 60vh; overflow: auto; }
.twk .row { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 8px; }
.twk .row label { color: var(--p-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.twk .row .ctl { display: flex; gap: 4px; flex-wrap: wrap; }
.twk .row .ctl button {
  flex: 1; padding: 2px 6px; color: var(--p-dim); border: 1px solid var(--line);
  font-size: 11px;
}
.twk .row .ctl button.on { background: var(--p); color: var(--bg); border-color: var(--p); font-weight: 700; }
.twk .row .ctl button:not(.on):hover { color: var(--p); }
.twk .row input[type=range] { width: 100%; accent-color: var(--p); }
.twk .twk-h-section { color: var(--p-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding-top: 4px; }

/* Wizard overlay */
.scrim {
  position: fixed; inset: 0; background: rgba(11,10,8,0.85);
  display: grid; place-items: center;
  z-index: 100; padding: 36px;
}
.dialog {
  width: min(900px, 100%); max-height: 90vh;
  background: var(--bg);
  border: 1px solid var(--p);
  display: grid; grid-template-rows: auto 1fr auto;
  box-shadow: 0 0 40px rgba(255,177,60,0.2);
}
.dialog .d-h {
  padding: 6px 12px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  font-size: 12px; color: var(--p);
}
.dialog .d-h .steps { display: flex; gap: 10px; margin-left: 14px; font-weight: 400; }
.dialog .d-h .steps span { color: var(--p-dim); }
.dialog .d-h .steps span.on { color: var(--p); border-bottom: 1px solid var(--p); }
.dialog .d-h .steps span.done { color: var(--ok); }
.dialog .d-h .x { margin-left: auto; }
.dialog .d-body { overflow: auto; padding: 18px; }
.dialog .d-foot {
  border-top: 1px solid var(--line);
  padding: 6px 12px;
  display: flex; align-items: center; gap: 8px;
}
.dialog .d-foot .help { color: var(--p-dim); font-size: 11px; }
.dialog .d-foot .right { margin-left: auto; display: flex; gap: 8px; }

.muted { color: var(--p-dim); }
.dim   { color: var(--p-faint); }
.b     { font-weight: 700; }

/* TUI ascii grid lines (faint) */
.box::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(transparent 50%, rgba(255,177,60,0.018) 50%);
  background-size: 100% 4px;
}

/* Pixel sprite for avatar (pure CSS box-shadow art) */
.sprite {
  width: 48px; height: 48px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 22px;
  color: var(--p);
  font-weight: 700;
}
.sprite svg { display: block; }

/* Phosphor variants */
[data-color="amber"] { --p: #ffb13c; --p-dim: #a06a1c; --p-faint:#3a2810; --p-soft:#eaa84b; }
[data-color="green"] { --p: #7dff7d; --p-dim: #3aa83a; --p-faint:#0e2a0e; --p-soft:#a0ffa0; }
[data-color="white"] { --p: #f5f5f5; --p-dim: #888;    --p-faint:#2a2a2a; --p-soft:#cfcfcf; }
[data-color="cyan"]  { --p: #6df0ff; --p-dim: #3aa0b8; --p-faint:#0e2228; --p-soft:#a8eaff; }
[data-color="paper"] {
  --bg:#f5efe1; --bg-1:#ece5d2; --bg-2:#dcd2bb; --line:#bdb198; --line-2:#8b8067;
  --p:#1c1408; --p-dim:#6a5a3a; --p-faint:#aa9d7c; --p-soft:#3a2c14;
}
[data-color="paper"] body::after { background: none; }
[data-color="paper"] body::before { opacity: 0.15; mix-blend-mode: multiply; }

/* small breakpoint guard */
@media (max-width: 1100px) {
  .body { grid-template-columns: 320px minmax(0, 1fr); }
}
</style>
